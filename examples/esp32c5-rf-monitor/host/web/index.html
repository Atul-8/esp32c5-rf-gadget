<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>esp-sdr Test Host · ESP32-C5 RF monitor</title>
  <link rel="stylesheet" href="css/app.css">
  <!-- QWebChannel 的 JS 库（Qt 内置资源，不联网） -->
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <!-- three.js 3D 引擎（本地 vendor，MIT） -->
  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/vendor/OrbitControls.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><span data-i18n="app.title">esp-sdr 测试上位机</span><span class="brand-sub" data-i18n="app.subtitle">ESP32-C5 射频监测 · 周期快照，非连续实时</span></div>

  <div class="controls">
    <label class="field"><span data-i18n="hdr.port">串口</span>
      <select id="port"><option value="">…</option></select>
    </label>
    <div class="gainbar" id="gainbar">
      <span class="gainbar__label" data-i18n="gain.label">增益</span>
      <div class="seg" role="group">
        <button class="seg__btn" data-gain-mode="HARDWARE" data-i18n="gain.hw" data-i18n-title="gain.hwTitle">AGC</button>
        <button class="seg__btn" data-gain-mode="MANUAL" data-i18n="gain.manual" data-i18n-title="gain.manualTitle">手动</button>
        <button class="seg__btn" data-gain-mode="AUTO" data-i18n="gain.auto" data-i18n-title="gain.autoTitle">自动</button>
      </div>
      <button class="btn btn--mini" id="gain-down" data-i18n-title="gain.down">−</button>
      <input id="gain" type="number" min="0" max="90" step="1" value="60" title="增益档（PHY 表索引，不是 dB）" data-i18n-title="hdr.gainTitle">
      <button class="btn btn--mini" id="gain-up" data-i18n-title="gain.up">+</button>
      <span class="gainbar__target" data-i18n-title="gain.targetTitle"><span data-i18n="gain.target">目标</span>
        <input id="gain-target" type="number" min="0" max="40" step="1" value="4">
      </span>
      <span class="gainbar__read" id="gain-read">—</span>
      <span class="gainbar__note" id="gain-note"></span>
    </div>
    <label class="field check"><input type="checkbox" id="mock"> <span data-i18n="hdr.mock">假固件</span></label>
    <label class="field"><span data-i18n="hdr.scenario">场景</span>
      <select id="scenario"></select>
    </label>
    <button id="btn-start" class="btn btn--primary" data-i18n="hdr.start">开始</button>
    <button id="btn-stop" class="btn" disabled data-i18n="hdr.stop">停止</button>
    <button id="btn-lang" class="btn btn--ghost" data-lang-toggle data-i18n="hdr.lang" data-i18n-title="hdr.langTitle">EN</button>
  </div>

  <div class="status" id="status" data-state="idle" data-i18n="status.idle">未连接</div>
</header>

<nav class="side" id="nav"></nav>

<main id="page-container" class="page"></main>

<footer class="foot">
  <div class="kv" id="kv"></div>
  <div class="stamp" id="code-stamp" data-i18n-title="foot.stampTitle"></div>
  <div class="log" id="log"></div>
</footer>

<script src="js/i18n.js"></script>
<script src="js/bridge.js"></script>
<script src="js/util.js"></script>
<script src="js/three3d.js"></script>
<script src="js/popout.js"></script>
<script src="js/router.js"></script>
<script src="js/scanbar.js"></script>
<script src="js/gain.js"></script>
<script src="js/pages/spectrum.js"></script>
<script src="js/pages/waterfall.js"></script>
<script src="js/pages/env.js"></script>
<script src="js/pages/occ.js"></script>
<script src="js/pages/round.js"></script>
<script src="js/app.js"></script>
</body>
</html>
